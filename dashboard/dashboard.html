<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Bot Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2 { color: #4CAF50; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 20px; max-width: 1600px; margin: auto; }
        .card { background-color: #2c2c2c; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #status { font-size: 1.2em; }
        #status-indicator { height: 15px; width: 15px; background-color: #f44336; border-radius: 50%; display: inline-block; margin-right: 10px; transition: background-color 0.5s; }
        #status.connected #status-indicator { background-color: #4CAF50; }
        .log-box { height: 300px; overflow-y: scroll; background-color: #111; border: 1px solid #444; padding: 10px; border-radius: 4px; font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace; font-size: 0.9em; }
        .log-box p { margin: 0; padding: 2px 0; border-bottom: 1px solid #333; }
        .log-box p:last-child { border-bottom: none; }
        .log-entry { color: #ccc; }
        .log-entry .timestamp { color: #888; }
        .log-entry.error { color: #ff7b7b; }
        .log-entry.success { color: #81c784; }
        .log-entry.info { color: #64b5f6; }
        .log-entry.opportunity { font-weight: bold; color: #ffd54f; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: #333; }
    </style>
</head>
<body>

    <h1>Arbitrage Bot Dashboard</h1>
    <div id="status">
        <span id="status-indicator"></span><span id="status-text">Connecting...</span>
    </div>

    <div class="container">
        <div class="card">
            <h2>Hot Pools (from Volume Scanner)</h2>
            <div id="hot-pools-log" class="log-box"></div>
        </div>
        <div class="card">
            <h2>Trade History & Opportunities</h2>
            <div id="trade-history-log" class="log-box"></div>
        </div>
        <div class="card" style="grid-column: 1 / -1;">
            <h2>General Log & Errors</h2>
            <div id="general-log" class="log-box"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const statusText = document.getElementById('status-text');
            const statusDiv = document.getElementById('status');
            const hotPoolsLog = document.getElementById('hot-pools-log');
            const tradeHistoryLog = document.getElementById('trade-history-log');
            const generalLog = document.getElementById('general-log');

            function addLog(element, message, type = 'info') {
                const p = document.createElement('p');
                const timestamp = new Date().toLocaleTimeString();
                p.className = `log-entry ${type}`;
                p.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
                element.appendChild(p);
                element.scrollTop = element.scrollHeight; // Auto-scroll to bottom
            }

            function connect() {
                const socket = new WebSocket('ws://localhost:8000/ws');

                socket.onopen = function(e) {
                    statusText.textContent = 'Connected';
                    statusDiv.classList.add('connected');
                    addLog(generalLog, 'WebSocket connection established.', 'success');
                };

                socket.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        const source = message.source || 'unknown';
                        const eventType = message.event || 'log';
                        const data = message.data;

                        if (source === 'volume_scanner') {
                            if (eventType === 'found_hot_pools') {
                                const count = data.length;
                                addLog(hotPoolsLog, `Found ${count} new hot pools.`, 'info');
                                data.forEach(pool => {
                                    addLog(hotPoolsLog, `Pool: ${pool.poolAddress} | TVL: ${Math.round(pool.tvlUSD)} USD`);
                                });
                            } else if (eventType === 'log') {
                                addLog(generalLog, `[Volume Scanner] ${data}`);
                            } else if (eventType === 'error') {
                                addLog(generalLog, `[Volume Scanner ERROR] ${data.message}`, 'error');
                            }
                        } 
                        else if (source === 'main_bot') {
                            if (eventType === 'opportunity_found') {
                                const profit = parseFloat(data.net_profit_usd).toFixed(4);
                                const msg = `[OPPORTUNITY] Path: ${data.path} | Profit: $${profit} | CEX: ${data.cex_symbol}`;
                                addLog(tradeHistoryLog, msg, 'opportunity');
                            } else if (eventType === 'trade_executed') {
                                const profit = parseFloat(data.net_profit_usd).toFixed(4);
                                const gas = parseFloat(data.gas_fee_usd).toFixed(4);
                                const msg = `[TRADE SUCCEEDED] Path: ${data.path} | Profit: $${profit} | Gas: $${gas} | CEX: ${data.cex_symbol}`;
                                addLog(tradeHistoryLog, msg, 'success');
                            } else if (eventType === 'trade_failed') {
                                addLog(tradeHistoryLog, `[TRADE FAILED] ${data.reason}`, 'error');
                            } else if (eventType === 'error') {
                                addLog(generalLog, `[Main Bot ERROR] ${data.message}`, 'error');
                            }
                             else {
                                addLog(generalLog, `[Main Bot] ${data}`);
                            }
                        }

                    } catch (error) {
                        console.error('Error parsing message:', error);
                        addLog(generalLog, event.data, 'error');
                    }
                };

                socket.onclose = function(event) {
                    statusText.textContent = 'Disconnected. Retrying in 3 seconds...';
                    statusDiv.classList.remove('connected');
                    addLog(generalLog, 'WebSocket connection closed. Attempting to reconnect...', 'error');
                    setTimeout(connect, 3000);
                };

                socket.onerror = function(error) {
                    console.error('WebSocket Error:', error);
                    addLog(generalLog, 'WebSocket error occurred.', 'error');
                    socket.close();
                };
            }

            connect();
        });
    </script>

</body>
</html>
